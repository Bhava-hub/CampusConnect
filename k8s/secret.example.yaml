# ==============================================================================
# CampusConnect - Kubernetes Secret Example Template
# WARNING: DO NOT COMMIT REAL CREDENTIALS TO SOURCE CONTROL!
#
# Kubernetes Secrets are base64-encoded strings by default (NOT encrypted at rest
# unless KMS envelope encryption is configured on the API server).
#
# Recommended methods to create this secret:
#
# Option A (Interactive command-line):
#   kubectl create secret generic campusconnect-secrets \
#     --namespace campusconnect \
#     --from-literal=MONGO_URI="mongodb+srv://<user>:<password>@cluster0.xxx.mongodb.net/campusconnect" \
#     --from-literal=JWT_SECRET="<generate-random-secret-key>"
#
# Option B (From local untracked file):
#   kubectl create secret generic campusconnect-secrets \
#     --namespace campusconnect \
#     --from-env-file=.env.production.secrets
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: campusconnect-secrets
  namespace: campusconnect
  labels:
    app.kubernetes.io/name: campusconnect-secrets
    app.kubernetes.io/part-of: campusconnect
type: Opaque
stringData:
  # Replace with actual MongoDB connection string (Atlas or internal MongoDB)
  MONGO_URI: "mongodb+srv://PLACEHOLDER_USER:PLACEHOLDER_PASSWORD@cluster0.example.mongodb.net/campusconnect?retryWrites=true&w=majority"
  # Replace with a strong cryptographically random secret string (min 32 chars)
  JWT_SECRET: "REPLACE_WITH_A_LONG_RANDOM_SECRET_KEY_MIN_32_CHARS"
