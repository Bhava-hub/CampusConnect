apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusconnect-backend
  namespace: campusconnect
  labels:
    app.kubernetes.io/name: campusconnect-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: campusconnect
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: campusconnect-backend
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campusconnect-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: campusconnect
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: campusconnect-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-api
              containerPort: 5000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: NODE_ENV
            - name: JWT_EXPIRE
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: JWT_EXPIRE
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: campusconnect-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campusconnect-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp-dir
          emptyDir: {}
