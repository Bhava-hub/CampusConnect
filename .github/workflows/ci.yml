name: CampusConnect Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Jest Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Test Suite with Jest
        env:
          CI: true
          GITHUB_ACTIONS: true
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'github_actions_ci_jwt_secret_key_testing_12345' }}
          MONGO_URI: mongodb://127.0.0.1:27017/campusconnect_test
        run: npm run test:ci

      - name: Upload Test Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-coverage
          path: server/coverage/
          retention-days: 7
